<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

</head>

<body>
    <header>
        <nav class="navbar">
            <h1 class="name">Noa Husić</h1>
            <a class="nav-link" href="index.html">Početna</a>
            <a class="nav-link" href="projekti.html">Projekti</a>
            <a class="nav-link" href="kontakt.html">Kontakt</a>
        </nav>
    </header>
    <main>
        <div class="kontakt-sadrzaj">
            <br>
            <h3 class="h3-opis">Ako imate bilo kakvih pitanja, slobodno me kontaktirajte putem e-maila ili ispunite
                obrazac ispod.</h3>
            <hr />
            <h1 class="h1-opis"><br><br>Kontakt</h1>
            <h3 class="h3-opis">Email: noahusicdev@gmail.com</h3>
            <form action="https://formspree.io/f/mqerznrn" method="POST">
                <div style="margin-bottom: 15px;">
                    <label for="email">Vaša e-mail adresa:</label><br>
                    <input type="email" name="email" id="email" required style="width: 80%; padding: 8px;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label for="message">Vaša poruka:</label><br>
                    <textarea name="message" id="message" required
                        style="width: 80%; height: 100px; padding: 8px;"></textarea>
                </div>

                <button type="submit" style="padding: 10px 20px; cursor: pointer;">Pošalji poruku</button>
            </form>
        </div>

    </main>

    <footer>
        <a class="git" href="https://github.com/NoaHusic-dev" target="_blank">GitHub <i class="fa fa-github"
                style="font-size:24px"></i></a>
        <p>&copy; Noa Husić | Sva prava pridržana</p>
    </footer>
</body>

</html>
