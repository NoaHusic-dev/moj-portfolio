<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><filter id="hb0" x="-20%" y="-10%" width="140%" height="120%"><feGaussianBlur class="hb" stdDeviation="0 0"/></filter></defs></svg>
<div class="cols" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
<header>
  <a class="logo" href="index.html" aria-label="Početna">NoaHusic-dev</a>
  <nav class="mini"><a href="projekti.html">Projekti</a><a href="index.html#o-meni">O meni</a><a href="kontakt.html" aria-current="page">Kontakt</a></nav>
</header>
<main>
<section class="ph">
  <h1><span class="w" data-blur="7">Kontakt</span></h1>
  <p class="lead rv">Imaš ideju, pitanje ili prijedlog suradnje? Napiši mi nekoliko rečenica.</p>
</section>
<section class="sec" style="padding-top:calc(4*var(--s))">
  <div class="lbl rv side"><p class="mini">Pošalji poruku</p><p class="mini" style="margin-top:2em"><a href="https://github.com/NoaHusic-dev" rel="noopener">GitHub ↗</a></p></div>
  <div class="bd rv" style="--d:.1s">
    <!-- Zamijeni YOUR_FORM_ID svojim Formspree ID-jem -->
    <form class="form" action="https://formspree.io/f/mqerznrn" method="POST" data-ajax>
      <div class="fld"><label class="mini" for="email">E-pošta</label><input id="email" name="email" type="email" autocomplete="email" placeholder="ime@primjer.hr" required></div>
      <div class="fld"><label class="mini" for="message">Poruka</label><textarea id="message" name="message" placeholder="Kako ti mogu pomoći?" required></textarea></div>
      <label class="chk"><input type="checkbox" name="privacy" value="da" required><span>Pročitao/la sam <a href="pravila-privatnosti.html">pravila privatnosti</a> i pristajem da se moji podaci koriste za odgovor na ovaj upit.</span></label>
      <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="send mini" type="submit">Pošalji <span aria-hidden="true">→</span></button>
      <p class="note" role="status" aria-live="polite"></p>
    </form>
  </div>
</section>
</main>
