<!DOCTYPE html>
<html lang="hr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kontaktirajte Noa Husića putem e-maila ili obrasca.">
    <title>Kontakt | Noa Husić</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>
    <header>
        <nav class="navbar" aria-label="Glavna navigacija">
            <a class="nav-link" href="index.html">Početna</a>
            <a class="nav-link" href="projekti.html">Projekti</a>
            <a class="nav-link" href="kontakt.html" aria-current="page">Kontakt</a>
        </nav>

        <section class="hero">
            <h1 class="name">Kontakt</h1>
            <p class="hero-opis">Imate pitanje ili prijedlog? Javite mi se putem e-maila ili ispunite obrazac.</p>
        </section>
    </header>

    <main>
        <div class="kontakt-sadrzaj">
            <section class="card kontakt-info">
                <h2 class="h2-opis">Podaci</h2>
                <ul class="kontakt-popis">
                    <li>
                        <span class="kontakt-ikona"><i class="fa fa-envelope" aria-hidden="true"></i></span>
                        <div>
                            <span class="kontakt-oznaka">E-mail</span>
                            <a href="mailto:noahusicdev@gmail.com">noahusicdev@gmail.com</a>
                        </div>
                    </li>
                    <li>
                        <span class="kontakt-ikona"><i class="fa fa-github" aria-hidden="true"></i></span>
                        <div>
                            <span class="kontakt-oznaka">GitHub</span>
                            <a href="https://github.com/NoaHusic-dev" target="_blank" rel="noopener">NoaHusic-dev</a>
                        </div>
                    </li>
                </ul>
            </section>

            <form action="https://formspree.io/f/mqerznrn" method="POST">
                <h2 class="h2-opis">Pošaljite poruku</h2>

                <div class="polje">
                    <label for="email">Vaša e-mail adresa</label>
                    <input type="email" name="email" id="email" placeholder="ime@primjer.com" required>
                </div>

                <div class="polje">
                    <label for="message">Vaša poruka</label>
                    <textarea name="message" id="message" placeholder="Napišite poruku..." required></textarea>
                </div>

                <div class="polje">
                    <label class="privola" for="pravila-privatnosti">
                        <input type="checkbox" name="pravila-privatnosti" id="pravila-privatnosti" required>
                        <span>Slažem se s <a href="pravila-privatnosti.html" target="_blank" rel="noopener">Pravilima privatnosti</a>.</span>
                    </label>
                </div>

                <button type="submit">Pošalji poruku</button>
            </form>
        </div>
    </main>

    <footer>
        <a class="git" href="https://github.com/NoaHusic-dev" target="_blank" rel="noopener">GitHub <i class="fa fa-github" style="font-size:24px" aria-hidden="true"></i></a>
        <a class="pravila-privatnosti" href="pravila-privatnosti.html" target="_blank" rel="noopener">Pravila privatnosti</a>
        <p>&copy; Noa Husić | Sva prava pridržana</p>
    </footer>
</body>

</html>
